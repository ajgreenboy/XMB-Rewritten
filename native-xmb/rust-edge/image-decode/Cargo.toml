[package]
name = "image-decode"
version = "0.1.0"
edition = "2021"
publish = false
description = "Safe Rust binary decoders for PS3 GTF/GIM textures, VAG audio, QRC containers, Edge meshes, and Blu-ray PGS / DVD VobSub subtitles"

[lib]
name = "image_decode"
crate-type = ["rlib"]

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[package]
name = "firmware-extract"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Safe Rust reimplementation of native XMB PS3UPDAT.PUP verification, SCE decryption, and ustar TAR extraction behind a narrow C ABI."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
firmware-crypto = { path = "../firmware-crypto" }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

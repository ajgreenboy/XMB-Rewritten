name: Tests

# Builds and runs every headless test runner (the XMB_*_BUILD_TESTS targets in native-xmb/CMakeLists.txt)
# on each push and pull request. Release packaging stays in release.yml.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Qt 6.10+ is needed for the Qt6BundledFreetype/Qt6FreetypePrivate CMake packages (see release.yml).
  # Matches the dev machine (INSTALL.md).
  QT_VERSION: '6.12.0'
  BUILD_DIR: ${{ github.workspace }}\out\tests

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      # The wiring between CMakeLists.txt, tests/ and this file must agree (work/ci-guard.ts); a runner that is
      # added in one place and forgotten in another otherwise only fails after a release tag.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Check the test wiring
        shell: pwsh
        run: |
          bun work/ci-guard.ts
          if ($LASTEXITCODE) { throw "Test wiring check failed." }

      # CMake POST_BUILD invokes the metadata helper with bare Windows PowerShell on the release runner.
      # Keep this independent of Qt, firmware, credentials and build outputs so it tests that exact contract.
      - name: Check native metadata hashing under Windows PowerShell 5.1
        shell: powershell
        run: |
          $test = Join-Path $env:GITHUB_WORKSPACE 'native-xmb\tests\build_metadata_tests.ps1'
          $powershell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $test
          if ($LASTEXITCODE -ne 0) { throw "Native metadata hashing regression failed (exit $LASTEXITCODE)." }

      - name: Check render-gate mutation regression
        shell: pwsh
        run: |
          bun work/ab-layers-mutation.ts
          if ($LASTEXITCODE) { throw "Render-gate mutation regression failed." }

      - name: Install Qt (MSVC 2022 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: 'win64_msvc2022_64'
          # find_package(Qt6 ... Multimedia) in CMakeLists.txt; Multimedia is an add-on module.
          modules: 'qtmultimedia'
          cache: true
          extra: '--base https://download.qt.io/'
          # aqtinstall 3.3.0 fails with "Failed to locate XML data" on Qt 6.11+, whose repository
          # moved to per-arch folders (qt6_6120/qt6_6120_msvc2022_64/); the current source reads them.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7'

      - name: Set up the MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure with every test runner enabled
        shell: pwsh
        run: |
          cmake -S native-xmb -B "$env:BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DXMB_STEAM_VDF_BUILD_TESTS=ON -DXMB_STEAM_TRACKING_BUILD_TESTS=ON -DXMB_STEAM_SWITCH_BUILD_TESTS=ON -DXMB_SETUP_BUILD_TESTS=ON -DXMB_AUTOLOGON_BUILD_TESTS=ON `
            -DXMB_UPDATER_BUILD_TESTS=ON -DXMB_FIRMWARE_BUILD_TESTS=ON -DXMB_RELEASE_BUILD_TESTS=ON `
            -DXMB_MANAGER_BUILD_TESTS=ON -DXMB_FILE_OPS_BUILD_TESTS=ON -DXMB_DISCORD_BUILD_TESTS=ON -DXMB_FOLDER_BROWSER_BUILD_TESTS=ON -DXMB_OSK_PASTE_BUILD_TESTS=ON -DXMB_PS_PAD_STATUS_BUILD_TESTS=ON -DXMB_BD_REMOTE_BUILD_TESTS=ON -DXMB_OSK_PAD_BUILD_TESTS=ON -DXMB_OSK_COMPOSITION_BUILD_TESTS=ON -DXMB_ZI8_BUILD_TESTS=ON -DXMB_JELLYFIN_SETUP_BUILD_TESTS=ON -DXMB_JELLYFIN_PLAYBACK_BUILD_TESTS=ON -DXMB_JELLYFIN_PLAYER_BUILD_TESTS=ON -DXMB_SEERR_WATCH_BUILD_TESTS=ON -DXMB_STEAM_QUIT_BUILD_TESTS=ON -DXMB_STEAM_HIDE_BUILD_TESTS=ON -DXMB_JELLYFIN_MUSIC_BUILD_TESTS=ON -DXMB_FRAME_PACER_BUILD_TESTS=ON -DXMB_GAMEBOOT_BACKGROUND_BUILD_TESTS=ON -DXMB_ARTWORK_BACKDROP_BUILD_TESTS=ON -DXMB_BOOT_WORDMARK_BUILD_TESTS=ON -DXMB_GALLERY_FLOOR_BUILD_TESTS=ON -DXMB_VIDEO_PANEL_BUILD_TESTS=ON -DXMB_STEAMCMD_BUILD_TESTS=ON -DXMB_RAF_BUILD_TESTS=ON -DXMB_IMPORTED_ART_BUILD_TESTS=ON -DXMB_LOGO_TILES_BUILD_TESTS=ON -DXMB_GAME_BADGE_BUILD_TESTS=ON -DXMB_SUBTITLE_BUILD_TESTS=ON -DXMB_RAWG_BUILD_TESTS=ON -DXMB_STORE_WAVE_BUILD_TESTS=ON -DXMB_PENDING_INSTALLER_BUILD_TESTS=ON -DXMB_LAUNCH_FADE_BUILD_TESTS=ON -DXMB_PLAYER_CHROME_BUILD_TESTS=ON -DXMB_INGAME_BACKDROP_BUILD_TESTS=ON -DXMB_PSN_PAGES_BUILD_TESTS=ON -DXMB_INSTALLER_PANEL_BUILD_TESTS=ON -DXMB_NOTIFICATION_TOAST_BUILD_TESTS=ON -DXMB_FRIENDS_UI_BUILD_TESTS=ON
          if ($LASTEXITCODE) { throw 'CMake configuration failed.' }

      - name: Build the test runners (and xmb-manager, which the manager tests drive)
        shell: pwsh
        run: |
          cmake --build "$env:BUILD_DIR" --parallel --target `
            xmb-steam-vdf-tests xmb-steam-tracking-tests xmb-steam-switch-tests xmb-setup-tests xmb-autologon-tests xmb-updater-tests `
            xmb-firmware-tests xmb-release-tests xmb-file-ops-tests xmb-folder-browser-tests xmb-osk-paste-tests xmb-ps-pad-status-tests xmb-bd-remote-tests xmb-osk-pad-tests xmb-osk-composition-tests xmb-zi8-tests xmb-discord-tests xmb-jellyfin-setup-tests xmb-jellyfin-playback-tests xmb-jellyfin-player-tests xmb-jellyfin-music-tests xmb-frame-pacer-tests xmb-gameboot-background-tests xmb-artwork-backdrop-tests xmb-boot-wordmark-tests xmb-gallery-floor-tests xmb-video-panel-tests xmb-steam-quit-tests xmb-steam-quit-standin xmb-steam-hide-tests xmb-steam-hide-standin xmb-manager-tests xmb-manager xmb-steamcmd-tests xmb-steamcmd-standin xmb-raf-tests xmb-imported-art-tests xmb-logo-tiles-tests xmb-game-badge-tests xmb-subtitle-tests xmb-seerr-watch-tests xmb-rawg-tests xmb-store-wave-tests xmb-pending-installer-tests xmb-launch-fade-tests xmb-launch-fade-standin xmb-player-chrome-tests xmb-ingame-backdrop-tests xmb-psn-pages-tests xmb-installer-panel-tests xmb-installer-standin xmb-notification-toast-tests xmb-friends-ui-tests
          if ($LASTEXITCODE) { throw 'Test build failed.' }

      - name: Run the test runners
        shell: pwsh
        env:
          QT_PLUGIN_PATH: ${{ env.QT_ROOT_DIR }}\plugins
          QT_QPA_PLATFORM: offscreen
        run: |
          $b = $env:BUILD_DIR
          $scratch = Join-Path $env:RUNNER_TEMP 'xmb-tests'
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          $runs = @(
            @{ Name = 'steam-vdf'; Exe = 'xmb-steam-vdf-tests.exe'; Args = @() },
            @{ Name = 'steam-tracking'; Exe = 'xmb-steam-tracking-tests.exe'; Args = @() },
            @{ Name = 'steam-switch'; Exe = 'xmb-steam-switch-tests.exe'; Args = @() },
            @{ Name = 'setup';     Exe = 'xmb-setup-tests.exe';     Args = @() },
            @{ Name = 'autologon'; Exe = 'xmb-autologon-tests.exe'; Args = @() },
            @{ Name = 'updater';   Exe = 'xmb-updater-tests.exe';   Args = @() },
            @{ Name = 'firmware';  Exe = 'xmb-firmware-tests.exe';  Args = @() },
            @{ Name = 'release';   Exe = 'xmb-release-tests.exe';   Args = @("$env:GITHUB_WORKSPACE\work\release-reader\fixtures\fitgirl-sample.json") },
            @{ Name = 'discord';   Exe = 'xmb-discord-tests.exe';   Args = @() },
            @{ Name = 'jellyfin-setup'; Exe = 'xmb-jellyfin-setup-tests.exe'; Args = @((Join-Path $scratch 'jellyfin-setup')) },
            @{ Name = 'jellyfin-playback'; Exe = 'xmb-jellyfin-playback-tests.exe'; Args = @() },
            @{ Name = 'jellyfin-player'; Exe = 'xmb-jellyfin-player-tests.exe'; Args = @() },
            @{ Name = 'seerr-watch'; Exe = 'xmb-seerr-watch-tests.exe'; Args = @() },
            @{ Name = 'steam-quit'; Exe = 'xmb-steam-quit-tests.exe'; Args = @((Join-Path $b 'xmb-steam-quit-standin.exe'), (Join-Path $scratch 'steam-quit')) },
            @{ Name = 'installer-panel'; Exe = 'xmb-installer-panel-tests.exe'; Args = @((Join-Path $b 'xmb-installer-standin.exe'), (Join-Path $scratch 'installer-panel')) },
            @{ Name = 'steam-hide'; Exe = 'xmb-steam-hide-tests.exe'; Args = @((Join-Path $b 'xmb-steam-hide-standin.exe'), (Join-Path $scratch 'steam-hide')) },
            @{ Name = 'steamcmd'; Exe = 'xmb-steamcmd-tests.exe'; Args = @((Join-Path $b 'xmb-steamcmd-standin.exe'), (Join-Path $scratch 'steamcmd')) },
            @{ Name = 'jellyfin-music'; Exe = 'xmb-jellyfin-music-tests.exe'; Args = @() },
            @{ Name = 'frame-pacer'; Exe = 'xmb-frame-pacer-tests.exe'; Args = @() },
            @{ Name = 'gameboot-background'; Exe = 'xmb-gameboot-background-tests.exe'; Args = @() },
            @{ Name = 'artwork-backdrop'; Exe = 'xmb-artwork-backdrop-tests.exe'; Args = @() },
            @{ Name = 'boot-wordmark'; Exe = 'xmb-boot-wordmark-tests.exe'; Args = @() },
            @{ Name = 'gallery-floor'; Exe = 'xmb-gallery-floor-tests.exe'; Args = @() },
            @{ Name = 'launch-fade'; Exe = 'xmb-launch-fade-tests.exe'; Args = @() },
            @{ Name = 'ingame-backdrop'; Exe = 'xmb-ingame-backdrop-tests.exe'; Args = @() },
            @{ Name = 'video-panel'; Exe = 'xmb-video-panel-tests.exe'; Args = @() },
            @{ Name = 'player-chrome'; Exe = 'xmb-player-chrome-tests.exe'; Args = @() },
            @{ Name = 'subtitle'; Exe = 'xmb-subtitle-tests.exe'; Args = @() },
            @{ Name = 'raf'; Exe = 'xmb-raf-tests.exe'; Args = @() },
            @{ Name = 'imported-art'; Exe = 'xmb-imported-art-tests.exe'; Args = @((Join-Path $scratch 'imported-art')) },
            @{ Name = 'logo-tiles'; Exe = 'xmb-logo-tiles-tests.exe'; Args = @() },
            @{ Name = 'game-badge'; Exe = 'xmb-game-badge-tests.exe'; Args = @() },
            @{ Name = 'psn-pages'; Exe = 'xmb-psn-pages-tests.exe'; Args = @() },
            @{ Name = 'notification-toast'; Exe = 'xmb-notification-toast-tests.exe'; Args = @() },
            @{ Name = 'friends-ui'; Exe = 'xmb-friends-ui-tests.exe'; Args = @() },
            @{ Name = 'rawg';       Exe = 'xmb-rawg-tests.exe';       Args = @() },
            @{ Name = 'store-wave'; Exe = 'xmb-store-wave-tests.exe'; Args = @() },
            @{ Name = 'pending-installer'; Exe = 'xmb-pending-installer-tests.exe'; Args = @() },
            @{ Name = 'file-ops';  Exe = 'xmb-file-ops-tests.exe';  Args = @((Join-Path $scratch 'file-ops')) },
            @{ Name = 'folder-browser'; Exe = 'xmb-folder-browser-tests.exe'; Args = @((Join-Path $scratch 'folder-browser')) },
            @{ Name = 'osk-paste'; Exe = 'xmb-osk-paste-tests.exe'; Args = @() },
            @{ Name = 'ps-pad-status'; Exe = 'xmb-ps-pad-status-tests.exe'; Args = @() },
            @{ Name = 'bd-remote'; Exe = 'xmb-bd-remote-tests.exe'; Args = @() },
            @{ Name = 'osk-pad'; Exe = 'xmb-osk-pad-tests.exe'; Args = @() },
            @{ Name = 'osk-composition'; Exe = 'xmb-osk-composition-tests.exe'; Args = @() },
            @{ Name = 'zi8-dictionary'; Exe = 'xmb-zi8-tests.exe'; Args = @() },
            # The manager runner only deletes a scratch root whose name ends in manager-dev.
            @{ Name = 'manager';   Exe = 'xmb-manager-tests.exe';   Args = @((Join-Path $scratch 'manager-dev'), (Join-Path $b 'xmb-manager.exe')) }
          )
          New-Item -ItemType Directory -Force -Path (Join-Path $scratch 'file-ops') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $scratch 'folder-browser') | Out-Null
          $failed = @()
          foreach ($r in $runs) {
            Write-Host "::group::$($r.Name)"
            $lines = & (Join-Path $b $r.Exe) @($r.Args) 2>&1 | ForEach-Object { "$_" }
            $code = $LASTEXITCODE
            $lines | ForEach-Object { Write-Host $_ }
            # Surface each failing check as an annotation so a red run names the check without opening the log.
            if ($code -ne 0) { $lines | Where-Object { $_ -match "FAIL|rror" } | Select-Object -First 8 | ForEach-Object { Write-Host "::error::$($r.Name): $_" } }
            Write-Host "::endgroup::"
            if ($code -ne 0) { Write-Host "::error::$($r.Name) tests failed (exit $code)"; $failed += $r.Name }
            else { Write-Host "$($r.Name): passed" }
          }
          if ($failed.Count) { throw "Failing test runners: $($failed -join ', ')" }

      - name: Run synthetic pending-installer helper lifecycle checks
        shell: powershell
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\native-xmb\tests\pending_installer_helper_tests.ps1"
          if ($LASTEXITCODE) { throw "Pending-installer helper lifecycle checks failed." }

name: Release

# Builds the app and the standalone updater from the full source tree and publishes the artifacts to a
# GitHub release. Trigger on a `v*` tag (or run manually). Everything is compiled here from source; no
# binaries are committed to the repository.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Code signing is optional and off until its secrets exist; see native-xmb/packaging/README.md ("Code signing").
# A job-level flag because `if:` can't read secrets directly.

env:
  # The text renderer (font_raster.cpp) links FreeType directly. CMake falls back to Qt's *private*
  # modules Qt6BundledFreetype/Qt6FreetypePrivate when a standalone FreeType isn't found, and those
  # private modules only became findable CMake packages in Qt 6.10. Pin to a Qt that ships them, and
  # keep it on the kit the tree is built and verified with locally (native-xmb/INSTALL.md: Qt 6.12.0).
  QT_VERSION: '6.12.0'

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.ARTIFACT_SIGNING_ENDPOINT != '' }}
    steps:
      - name: Check out the full source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt (MSVC 2022 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: 'win64_msvc2022_64'
          cache: true
          # Multimedia is an add-on module, not part of the base kit; CMakeLists.txt requires it.
          modules: 'qtmultimedia'
          # Qt 6.11+ moved its online repository to per-arch folders (qt6_6120/qt6_6120_msvc2022_64/),
          # which aqtinstall 3.3.0 (the latest release) can't read: it fails with "Failed to locate XML
          # data". Install aqt from a pinned upstream commit that understands the new layout.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7'

      - name: Unpack Steamworks headers (optional)
        shell: pwsh
        env:
          STEAMWORKS_HEADERS_B64: ${{ secrets.STEAMWORKS_HEADERS_B64 }}
        run: |
          if ($env:STEAMWORKS_HEADERS_B64) {
            $zip = Join-Path $env:RUNNER_TEMP 'steamworks-headers.zip'
            $dir = Join-Path $env:RUNNER_TEMP 'steamworks-headers'
            [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($env:STEAMWORKS_HEADERS_B64))
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            "STEAMWORKS_HEADERS=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Steamworks headers unpacked to $dir (xmb-steam-client will be built)"
          } else {
            Write-Host "No STEAMWORKS_HEADERS_B64 secret; building without the xmb-steam-client helper."
          }

      - name: Build the app and the updater
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files (x86)\Microsoft Visual Studio\Installer;$env:PATH"
          .\native-xmb\build.ps1 -OutputDirectory C:\release\out -QtRoot "$env:QT_ROOT_DIR"

      # Sign our own executables before they are packaged, so the zip, the updater and the installer all carry
      # signed binaries. (The Qt DLLs come signed by Qt.) Skipped when the signing secrets aren't set.
      - name: Sign the executables
        if: env.SIGNING == 'true'
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files-folder: C:\release\out
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Code signing rewrites re-ps3-native.exe in place, so build-info.json's
      # executableSha256 no longer matches it. Refresh only that hash (the source
      # provenance is unchanged) so build-package.ps1's provenance guard still
      # passes against the signed exe. Skipped when signing is off.
      - name: Refresh build metadata after signing
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          .\native-xmb\write-build-info.ps1 -OutputDirectory C:\release\out -ProjectRoot "$env:GITHUB_WORKSPACE" -RefreshExecutableHash

      # Controller mode's driver (ViGEmBus) is bundled but never committed: fetched from the URL pinned in
      # native-xmb/packaging/vigem-driver.json and verified (size, SHA-256 AND Authenticode signer). A mismatch fails the
      # release here, before anything is packaged. build-package.ps1 then reuses this verified copy as its cache.
      - name: Fetch and verify the controller driver installer
        shell: pwsh
        run: |
          .\native-xmb\packaging\fetch-vigem-driver.ps1 -Destination "$env:RUNNER_TEMP\vigem-cache"
          if (-not $?) { throw 'ViGEmBus installer verification failed.' }
          "XMB_VIGEM_CACHE=$env:RUNNER_TEMP\vigem-cache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package the app
        shell: pwsh
        run: |
          .\native-xmb\packaging\build-package.ps1 -OutputDirectory C:\release\out -PackageDirectory C:\release\dist\re-ps3 -Zip

      - name: Package the updater (exe + its Qt DLLs)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path C:\release\dist\xmb-updater -Force | Out-Null
          Copy-Item C:\release\out\xmb-updater.exe C:\release\dist\xmb-updater\
          & (Join-Path "$env:QT_ROOT_DIR" 'bin\windeployqt.exe') --release --no-translations --no-compiler-runtime C:\release\dist\xmb-updater\xmb-updater.exe
          Compress-Archive -Path C:\release\dist\xmb-updater\* -DestinationPath C:\release\dist\xmb-updater.zip

      # The in-app updater (src/updater.cpp) refuses a release unless it can verify re-ps3.zip against a
      # SHA-256, taken from a `SHA256: <hex>` line in the notes or a `re-ps3.zip.sha256` asset. Attach the
      # sidecar in the usual `<hex>  <file>` form. It also refuses a tag that is not newer than the running
      # app's version, which comes from project(VERSION ...) in CMakeLists.txt, so the two must agree.
      - name: Write the SHA-256 sidecar and check the version
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 C:\release\dist\re-ps3.zip).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText('C:\release\dist\re-ps3.zip.sha256', "$hash  re-ps3.zip`n")
          Write-Host "re-ps3.zip SHA-256: $hash"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $cmake = Get-Content native-xmb\CMakeLists.txt -Raw
            if ($cmake -notmatch 'project\(\s*\S+\s+VERSION\s+([0-9.]+)') { throw 'No project(VERSION) in native-xmb/CMakeLists.txt' }
            $tag = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tag -ne $Matches[1]) { throw "Tag $env:GITHUB_REF_NAME does not match CMake project version $($Matches[1]); bump project(VERSION) first." }
          }

      # The installer wraps the same folder the zip carries (native-xmb/packaging/installer/re-ps3.iss). The zip
      # stays the in-app updater's download; the installer is for a first install on a new PC.
      - name: Build the installer
        shell: pwsh
        run: |
          $cmake = Get-Content native-xmb\CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(\s*\S+\s+VERSION\s+([0-9.]+)') { throw 'No project(VERSION) in native-xmb/CMakeLists.txt' }
          $version = $Matches[1]
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version 6.7.1 -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Installing Inno Setup failed ($LASTEXITCODE)" }
          }
          & $iscc /Qp "/DAppVersion=$version" /DSourceDir=C:\release\dist\re-ps3 /DOutputDir=C:\release\dist native-xmb\packaging\installer\re-ps3.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-Item C:\release\dist\re-ps3-setup.exe | Format-Table Name, Length

      - name: Sign the installer
        if: env.SIGNING == 'true'
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files: C:\release\dist\re-ps3-setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload the packages as run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            C:\release\dist\re-ps3.zip
            C:\release\dist\re-ps3.zip.sha256
            C:\release\dist\xmb-updater.zip
            C:\release\dist\re-ps3-setup.exe

      # Only a tag push publishes a GitHub release; a manual run on a branch stops at the artifacts above.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            C:\release\dist\re-ps3.zip
            C:\release\dist\re-ps3.zip.sha256
            C:\release\dist\xmb-updater.zip
            C:\release\dist\re-ps3-setup.exe
          generate_release_notes: true

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the full source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libsdl2-dev libpulse-dev libsecret-1-dev \
            libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1-dev libfreetype-dev \
            zlib1g-dev file desktop-file-utils

      - name: Install Qt (Linux GCC 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: 'linux_gcc_64'
          cache: true
          modules: 'qtmultimedia'
          extra: '--base https://download.qt.io/'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7'

      - name: Configure and build Linux release binaries
        run: |
          cmake -S native-xmb -B out/linux-release -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DXMB_RUST_FIRMWARE_CRYPTO=ON -DXMB_USE_RUST_EDGE=ON
          cmake --build out/linux-release --parallel --target re-ps3-native xmb-manager xmb-updater

      - name: Package the Linux AppImage and SHA-256 sidecar
        run: |
          chmod +x native-xmb/packaging/linux/build-appimage.sh
          QT_ROOT="$QT_ROOT_DIR" BUILD_DIR="$GITHUB_WORKSPACE/out/linux-release" OUT_DIR="$GITHUB_WORKSPACE/out/appimage" \
            ./native-xmb/packaging/linux/build-appimage.sh
          (cd out/appimage && sha256sum XMB-Rewritten-x86_64.AppImage > XMB-Rewritten-x86_64.AppImage.sha256)

      - name: Upload Linux AppImage as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-linux
          path: |
            out/appimage/XMB-Rewritten-x86_64.AppImage
            out/appimage/XMB-Rewritten-x86_64.AppImage.sha256

      - name: Publish Linux AppImage to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/appimage/XMB-Rewritten-x86_64.AppImage
            out/appimage/XMB-Rewritten-x86_64.AppImage.sha256
          generate_release_notes: true
